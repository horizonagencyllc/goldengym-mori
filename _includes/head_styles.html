<style>
/* ============================================================
   GOLDEN GYM · MORI (TN) — v5 · sito multi-pagina Jekyll
   Design: modern premium · bianco / inchiostro / oro
   Type: Sora (display) + Plus Jakarta Sans (testo)
   Realizzato da Horizon Agency
   ============================================================ */

/* ---------- TOKENS ---------- */
:root{
  --bg:#FFFFFF;
  --surface:#F4F5F7;
  --surface-2:#ECEEF1;
  --ink:#0E0F12;
  --ink-2:#33363F;
  --muted:#6A6F7B;
  --faint:#9AA0AB;
  --line:#E5E7EB;
  --line-2:#D9DCE1;

  --dark:#101116;
  --dark-2:#191B22;
  --dark-3:#23252E;
  --on-dark:#F2F3F5;
  --on-dark-mut:#9DA2AD;
  --dark-line:rgba(255,255,255,.09);

  --gold:#FFB400;
  --gold-deep:#E89E00;
  --gold-soft:#FFF3D4;
  --gold-tint:#FFF9EC;

  --ok:#1DA85B;

  /* Horizon Agency — brand (viola/gradiente) */
  --hz:#A98CFF;
  --hz-grad:linear-gradient(135deg,#8B5CF6 0%,#7177EE 48%,#54C6E8 100%);

  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:30px; --r-pill:999px;

  --sh-sm:0 2px 8px rgba(14,15,18,.05);
  --sh-md:0 14px 34px -16px rgba(14,15,18,.18);
  --sh-lg:0 30px 70px -30px rgba(14,15,18,.32);
  --sh-gold:0 18px 40px -18px rgba(255,180,0,.55);

  --e:cubic-bezier(.22,1,.36,1);
  --e-soft:cubic-bezier(.33,1,.68,1);

  --shell:1280px;
  --pad:clamp(20px,4.6vw,64px);
  --sp:clamp(70px,9vw,128px);

  --f-d:"Sora","Helvetica Neue",Arial,sans-serif;
  --f-t:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
}

/* ---------- RESET ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;width:100%}
body{
  font-family:var(--f-t);
  font-size:clamp(15px,1.04vw,16.5px);
  line-height:1.62;
  color:var(--ink-2);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  width:100%;
  position:relative;
}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
ul{list-style:none}
h1,h2,h3,h4,h5,h6{margin:0;font-family:var(--f-d);color:var(--ink);font-weight:700;line-height:1.08;letter-spacing:-.02em}
p{margin:0}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px}

/* ---------- LAYOUT ---------- */
.shell{max-width:var(--shell);margin:0 auto;padding-inline:var(--pad)}
.section{padding-block:var(--sp)}
.bg-surf{background:var(--surface)}
.bg-dark{background:var(--dark);color:var(--on-dark)}
.bg-dark h1,.bg-dark h2,.bg-dark h3,.bg-dark h4{color:#fff}

/* ---------- TYPE ---------- */
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--f-t);font-size:.76rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);
}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--gold);border-radius:2px}
.bg-dark .eyebrow{color:var(--gold)}
.t-xl{font-size:clamp(2.5rem,5.6vw,4.6rem);font-weight:800;letter-spacing:-.035em;line-height:1.02}
.t-lg{font-size:clamp(2rem,3.8vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.06}
.t-md{font-size:clamp(1.45rem,2.3vw,2rem);font-weight:700;letter-spacing:-.025em}
.lead{font-size:clamp(1.04rem,1.3vw,1.2rem);line-height:1.62;color:var(--muted);max-width:56ch}
.bg-dark .lead{color:var(--on-dark-mut)}
.mark{
  background:linear-gradient(180deg,transparent 58%,var(--gold) 58%,var(--gold) 92%,transparent 92%);
  padding-inline:.04em;
}
.gold-t{color:var(--gold-deep)}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--f-t);font-weight:700;font-size:.95rem;
  padding:15px 26px;border-radius:var(--r-sm);
  transition:transform .3s var(--e),box-shadow .3s var(--e),background .25s,color .25s,border-color .25s;
  white-space:nowrap;
}
.btn svg{width:17px;height:17px;transition:transform .3s var(--e)}
.btn-gold{background:var(--gold);color:var(--ink);box-shadow:var(--sh-gold)}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 24px 50px -18px rgba(255,180,0,.7)}
.btn-gold:hover svg{transform:translateX(3px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.btn-dark:hover svg{transform:translateX(3px)}
.btn-ghost{border:1.6px solid var(--line-2);color:var(--ink);background:var(--bg)}
.btn-ghost:hover{border-color:var(--ink);transform:translateY(-3px)}
.bg-dark .btn-ghost{background:transparent;border-color:var(--dark-line);color:#fff}
.bg-dark .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-wa{background:#1FA855;color:#fff}
.btn-wa:hover{transform:translateY(-3px);box-shadow:0 22px 44px -18px rgba(31,168,85,.6)}
.btn-lg{padding:18px 32px;font-size:1rem}
.btn-block{width:100%}

/* ---------- TOPBAR ---------- */
.topbar{background:var(--ink);color:var(--on-dark-mut);font-size:.81rem}
.topbar .shell{display:flex;justify-content:space-between;align-items:center;gap:18px;padding-block:9px}
.topbar a{color:var(--on-dark);font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:color .2s}
.topbar a:hover{color:var(--gold)}
.topbar svg{width:14px;height:14px}
.topbar .tb-rate{display:flex;align-items:center;gap:7px}
.topbar .tb-rate .s{color:var(--gold)}
.topbar .tb-hide{display:inline}
@media(max-width:680px){.topbar .tb-hide{display:none}.topbar .shell{justify-content:center}}

/* ---------- NAV ---------- */
.nav{position:sticky;top:0;z-index:200;background:var(--bg);border-bottom:1px solid var(--line);transition:box-shadow .3s,background .35s}
.nav.stuck{box-shadow:var(--sh-sm)}
.nav .shell{display:flex;align-items:center;justify-content:space-between;gap:28px;padding-block:14px}
.logo{display:flex;align-items:center;gap:11px}
.logo-mark{
  width:42px;height:42px;border-radius:11px;background:var(--ink);
  display:grid;place-items:center;position:relative;flex-shrink:0;
}
.logo-mark::before{content:"";position:absolute;inset:0;border-radius:11px;border:1.5px solid var(--gold);transform:rotate(0);transition:transform .4s var(--e)}
.logo:hover .logo-mark::before{transform:rotate(12deg)}
.logo-mark span{font-family:var(--f-d);font-weight:800;font-size:1.25rem;color:var(--gold)}
.logo-txt b{font-family:var(--f-d);font-weight:800;font-size:1.18rem;letter-spacing:-.03em;color:var(--ink);display:block;line-height:1;white-space:nowrap}
.logo-txt small{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav-menu{display:flex;align-items:center;gap:3px}
.nav-menu a{
  position:relative;padding:10px 15px;border-radius:var(--r-xs);
  font-weight:600;font-size:.94rem;color:var(--ink-2);
  transition:color .2s,background .2s;
}
.nav-menu a:hover{color:var(--ink);background:var(--surface)}
.nav-menu a.on{color:var(--ink)}
.nav-menu a.on::after{content:"";position:absolute;left:15px;right:15px;bottom:3px;height:2.5px;background:var(--gold);border-radius:2px}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-phone{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);font-size:.92rem}
.nav-phone svg{width:16px;height:16px;color:var(--gold-deep)}
.burger{display:none;width:46px;height:46px;border:1.5px solid var(--line-2);border-radius:var(--r-xs);flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
.burger i{width:19px;height:2px;background:var(--ink);border-radius:2px;transition:transform .3s,opacity .3s}
body.menu .burger i:nth-child(1){transform:translateY(7px) rotate(45deg)}
body.menu .burger i:nth-child(2){opacity:0}
body.menu .burger i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* nav diventa scuro quando il menu mobile è aperto */
body.menu{overflow:hidden}
body.menu .nav{background:var(--dark);border-bottom-color:var(--dark-line);box-shadow:none}
body.menu .nav .logo-txt b{color:#fff}
body.menu .nav .logo-txt small{color:var(--on-dark-mut)}
body.menu .burger{border-color:rgba(255,255,255,.22)}
body.menu .burger i{background:#fff}

/* backdrop dietro al menu */
.menu-backdrop{position:fixed;inset:0;z-index:170;background:rgba(8,9,13,.55);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
body.menu .menu-backdrop{opacity:1;visibility:visible}

/* menu mobile = pannello compatto a comparsa */
.drawer{
  position:fixed;top:80px;left:12px;right:12px;z-index:185;
  background:var(--dark);border:1px solid rgba(255,255,255,.09);
  border-radius:20px;padding:12px;
  box-shadow:0 36px 72px -26px rgba(0,0,0,.78);
  opacity:0;visibility:hidden;transform:translateY(-14px) scale(.97);
  transform-origin:top center;
  transition:opacity .28s var(--e),transform .36s var(--e),visibility .36s;
  max-height:calc(100vh - 104px);
  max-height:calc(100dvh - 104px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
body.menu .drawer{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.d-menu{display:flex;flex-direction:column;gap:3px}
.d-link{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 15px;border-radius:13px;
  font-family:var(--f-d);font-weight:700;font-size:1.12rem;color:#fff;
  transition:background .2s,color .2s;
}
.d-link:hover,.d-link:active{background:var(--dark-2)}
.d-link.on{background:var(--gold);color:var(--ink)}
.d-link span{
  font-family:var(--f-t);font-size:.72rem;font-weight:800;color:var(--gold-deep);
  width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);
  display:grid;place-items:center;transition:background .2s,color .2s;
}
.d-link.on span{background:rgba(14,15,18,.16);color:var(--ink)}
.d-foot{margin-top:9px;padding-top:12px;border-top:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:9px}
.d-foot .btn{justify-content:center;width:100%;padding-block:14px}
.drawer .btn-ghost{background:transparent;border-color:rgba(255,255,255,.22);color:#fff}
.drawer .btn-ghost:hover{border-color:var(--gold);color:var(--gold);background:transparent}
body.menu .d-link,body.menu .d-foot>*{animation:dItem .42s var(--e) backwards}
body.menu .d-link:nth-child(1){animation-delay:.05s}
body.menu .d-link:nth-child(2){animation-delay:.09s}
body.menu .d-link:nth-child(3){animation-delay:.13s}
body.menu .d-link:nth-child(4){animation-delay:.17s}
body.menu .d-link:nth-child(5){animation-delay:.21s}
body.menu .d-foot>*:nth-child(1){animation-delay:.25s}
body.menu .d-foot>*:nth-child(2){animation-delay:.29s}
@keyframes dItem{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- PAGE ENTRANCE ---------- */
main#top{animation:pageIn .55s var(--e)}
@keyframes pageIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* reveal */
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s var(--e),transform .8s var(--e)}
.rv.in{opacity:1;transform:none}
.rv1{transition-delay:.07s}.rv2{transition-delay:.14s}.rv3{transition-delay:.21s}
.rv4{transition-delay:.28s}.rv5{transition-delay:.35s}

/* ---------- SECTION HEAD ---------- */
.sec-head{max-width:660px;margin-bottom:clamp(34px,4.6vw,58px)}
.sec-head.center{margin-inline:auto;text-align:center}
.sec-head.center .eyebrow{justify-content:center}
.sec-head h2{margin-top:16px}
.sec-head p{margin-top:16px}
.sec-head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:clamp(34px,4.6vw,58px)}
.sec-head-row .sec-head{margin-bottom:0}

/* ============================================================
   PAGE HERO (interne)
   ============================================================ */
.phero{background:var(--dark);color:var(--on-dark);position:relative;overflow:hidden}
.phero::before{
  content:"";position:absolute;right:-8%;top:-40%;width:60%;height:180%;
  background:radial-gradient(circle,rgba(255,180,0,.16),transparent 62%);
}
.phero .shell{position:relative;z-index:2;padding-block:clamp(54px,7vw,96px)}
.phero .crumbs{font-size:.84rem;color:var(--on-dark-mut);font-weight:600;margin-bottom:18px}
.phero .crumbs b{color:var(--gold)}
.phero h1{font-size:clamp(2.4rem,5.4vw,4.2rem);font-weight:800;letter-spacing:-.035em;line-height:1.03;color:#fff;max-width:18ch}
.phero h1 em{font-style:normal;color:var(--gold)}
.phero p{margin-top:20px;max-width:54ch;color:var(--on-dark-mut);font-size:1.08rem}

/* ============================================================
   HOME — HERO
   ============================================================ */
.hero{position:relative;overflow:hidden}
.hero .shell{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,4vw,64px);align-items:center;padding-block:clamp(40px,5vw,84px)}
.hero-badge{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--gold-tint);border:1px solid var(--gold-soft);
  padding:7px 14px 7px 8px;border-radius:var(--r-pill);
  font-size:.82rem;font-weight:700;color:var(--ink);margin-bottom:22px;
}
.hero-badge .pin{background:var(--gold);color:var(--ink);font-size:.68rem;padding:4px 9px;border-radius:var(--r-pill);font-weight:800;letter-spacing:.02em}
.hero h1{font-size:clamp(2.6rem,5.4vw,4.7rem);font-weight:800;letter-spacing:-.038em;line-height:1.01}
.hero-sub{margin-top:22px;font-size:clamp(1.05rem,1.3vw,1.2rem);color:var(--muted);max-width:46ch;line-height:1.6}
.hero-cta{margin-top:30px;display:flex;gap:13px;flex-wrap:wrap}
.hero-proof{margin-top:30px;display:flex;align-items:center;gap:16px}
.hero-proof .avs{display:flex}
.hero-proof .avs span{
  width:40px;height:40px;border-radius:50%;border:2.5px solid var(--bg);
  margin-left:-12px;background-size:cover;background-position:center;
}
.hero-proof .avs span:first-child{margin-left:0}
.hero-proof .pt b{display:block;font-family:var(--f-d);font-weight:700;color:var(--ink);font-size:.95rem}
.hero-proof .pt .s{color:var(--gold-deep);letter-spacing:.05em;font-size:.82rem}
.hero-proof .pt span{font-size:.82rem;color:var(--muted)}

.hero-visual{position:relative}
.hero-img{
  position:relative;border-radius:var(--r-xl);overflow:hidden;
  aspect-ratio:4/4.4;background:var(--surface-2);box-shadow:var(--sh-lg);
}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-card{
  position:absolute;background:var(--bg);border-radius:var(--r-md);
  box-shadow:var(--sh-md);padding:16px 18px;
}
.hero-card-1{left:-26px;top:38px;display:flex;align-items:center;gap:12px}
.hero-card-1 .ic{width:42px;height:42px;border-radius:11px;background:var(--gold-tint);display:grid;place-items:center}
.hero-card-1 .ic svg{width:21px;height:21px;color:var(--gold-deep)}
.hero-card-1 b{display:block;font-family:var(--f-d);font-size:.95rem;color:var(--ink)}
.hero-card-1 span{font-size:.78rem;color:var(--muted)}
.hero-card-2{right:-22px;bottom:42px;width:188px}
.hero-card-2 .big{font-family:var(--f-d);font-weight:800;font-size:2.5rem;color:var(--ink);line-height:1;letter-spacing:-.03em}
.hero-card-2 .big sup{font-size:.36em;color:var(--gold-deep);top:-1.4em}
.hero-card-2 p{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.4}
.hero-card-2 .bars{display:flex;gap:4px;margin-top:10px}
.hero-card-2 .bars i{height:6px;flex:1;background:var(--surface-2);border-radius:3px}
.hero-card-2 .bars i.f{background:var(--gold)}

/* ---------- TICKER ---------- */
.ticker{background:var(--ink);color:#fff;overflow:hidden;padding-block:15px}
.ticker .row{display:flex;width:max-content;animation:tick 38s linear infinite}
.ticker .row>span{display:flex;align-items:center;gap:clamp(18px,3vw,38px);padding-inline:clamp(18px,3vw,38px);font-family:var(--f-d);font-weight:700;font-size:clamp(1rem,1.5vw,1.3rem);letter-spacing:-.01em;white-space:nowrap}
.ticker .row>span i{width:7px;height:7px;background:var(--gold);border-radius:50%;display:inline-block}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- STATS BAND ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(18px,2.4vw,32px)}
.stat{padding:30px 26px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);transition:transform .35s var(--e),box-shadow .35s var(--e)}
.stat:hover{transform:translateY(-5px);box-shadow:var(--sh-md)}
.stat .n{font-family:var(--f-d);font-weight:800;font-size:clamp(2.3rem,3.4vw,3rem);color:var(--ink);letter-spacing:-.035em;line-height:1}
.stat .n sup{font-size:.4em;color:var(--gold-deep);top:-1.2em}
.stat .l{margin-top:10px;font-size:.9rem;color:var(--muted);line-height:1.45}
.stat .bar{margin-top:16px;height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--gold);border-radius:2px}

/* ---------- BENTO ---------- */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:clamp(14px,1.6vw,20px)}
.bento .cell{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:30px;transition:transform .35s var(--e),box-shadow .35s var(--e),border-color .35s;
  position:relative;overflow:hidden;
}
.bg-surf .bento .cell{background:var(--bg)}
.bg-surf .bento .cell.feat,.bento .cell.feat{background:var(--ink)}
.bento .cell:hover{transform:translateY(-5px);box-shadow:var(--sh-md);border-color:var(--line-2)}
.bento .feat{
  grid-column:span 2;grid-row:span 2;color:#fff;
  display:flex;flex-direction:column;justify-content:flex-end;
  min-height:340px;border:0;background:var(--ink);isolation:isolate;
}
.bento .feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.bento .feat::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(14,15,18,.15) 0%,rgba(14,15,18,.58) 52%,rgba(14,15,18,.94) 100%)}
.bento .feat .tag,.bento .feat h3,.bento .feat p{position:relative;z-index:2}
.bento .feat .tag{font-size:.76rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
.bento .cell.feat h3{color:#fff;font-size:clamp(1.4rem,2vw,1.85rem);margin-top:12px;max-width:18ch}
.bento .cell.feat p{margin-top:10px;color:rgba(255,255,255,.86);font-size:.94rem;max-width:36ch}
.bento .wide{grid-column:span 2}
.bento .ic{width:48px;height:48px;border-radius:13px;background:var(--gold-tint);display:grid;place-items:center;margin-bottom:18px}
.bento .ic svg{width:24px;height:24px;color:var(--gold-deep)}
.bento .cell h3{font-size:1.2rem;color:var(--ink)}
.bento .cell p{margin-top:9px;font-size:.92rem;color:var(--muted);line-height:1.55}
.bento .cell .rate{font-family:var(--f-d);font-weight:800;font-size:2.6rem;color:var(--ink);letter-spacing:-.03em;line-height:1}
.bento .cell .rate sup{font-size:.34em;color:var(--gold-deep);top:-1.5em}
.bento .cell .stars{color:var(--gold);letter-spacing:.08em;margin-top:6px;font-size:.95rem}

/* ---------- DISCIPLINE CARDS ---------- */
.disc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,1.8vw,24px)}
.disc-card{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;
  transition:transform .35s var(--e),box-shadow .35s var(--e);
}
.disc-card:hover{transform:translateY(-6px);box-shadow:var(--sh-md)}
.disc-card .ph{aspect-ratio:5/4;overflow:hidden;position:relative}
.disc-card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--e)}
.disc-card:hover .ph img{transform:scale(1.07)}
.disc-card .ph .num{position:absolute;top:12px;left:12px;background:var(--bg);color:var(--ink);font-family:var(--f-d);font-weight:800;font-size:.82rem;padding:6px 11px;border-radius:var(--r-pill)}
.disc-card .bd{padding:24px;flex:1;display:flex;flex-direction:column}
.disc-card .bd h3{font-size:1.28rem;color:var(--ink)}
.disc-card .bd p{margin-top:9px;font-size:.92rem;color:var(--muted);line-height:1.55;flex:1}
.disc-card .bd .go{margin-top:18px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.88rem;color:var(--ink)}
.disc-card .bd .go svg{width:15px;height:15px;color:var(--gold-deep);transition:transform .3s var(--e)}
.disc-card:hover .bd .go svg{transform:translateX(4px)}

/* ---------- METHOD ---------- */
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,26px)}
.mstep{position:relative;padding:32px 28px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg)}
.bg-dark .mstep{background:var(--dark-2);border-color:var(--dark-line)}
.mstep .num{font-family:var(--f-d);font-weight:800;font-size:3.4rem;color:var(--surface-2);line-height:.8;letter-spacing:-.04em}
.bg-dark .mstep .num{color:var(--dark-3)}
.mstep .num b{color:var(--gold)}
.mstep h3{margin-top:14px;font-size:1.25rem}
.bg-dark .mstep h3{color:#fff}
.mstep p{margin-top:10px;font-size:.93rem;color:var(--muted);line-height:1.58}
.bg-dark .mstep p{color:var(--on-dark-mut)}
.mstep .tag{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gold-deep)}
.bg-dark .mstep .tag{color:var(--gold)}
.mstep .tag::before{content:"";width:16px;height:2px;background:var(--gold);border-radius:2px}

/* ---------- SPLIT (testo + immagine) ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,80px);align-items:center}
.split.flip .split-media{order:2}
.split-media{position:relative}
.split-media .ph{border-radius:var(--r-xl);overflow:hidden;aspect-ratio:5/5.4;box-shadow:var(--sh-lg)}
.split-media .ph img{width:100%;height:100%;object-fit:cover}
.split-media .badge{
  position:absolute;background:var(--bg);border-radius:var(--r-md);box-shadow:var(--sh-md);
  padding:16px 20px;bottom:-22px;right:-20px;
}
.split-media .badge b{font-family:var(--f-d);font-weight:800;font-size:1.7rem;color:var(--ink);display:block;line-height:1}
.split-media .badge span{font-size:.8rem;color:var(--muted)}
.split-body h2{margin-top:16px}
.split-body>p{margin-top:18px;color:var(--muted)}
.split-list{margin-top:24px;display:flex;flex-direction:column;gap:13px}
.split-list li{display:flex;gap:12px;font-size:.96rem;color:var(--ink-2)}
.split-list li svg{width:20px;height:20px;color:var(--gold-deep);flex-shrink:0;margin-top:2px}
.bg-dark .split-list li{color:var(--on-dark)}
.split-body .btn{margin-top:28px}

/* ---------- DISCIPLINE DETAIL BLOCKS ---------- */
.dblock{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,76px);align-items:center}
.dblock+.dblock{margin-top:clamp(46px,6vw,96px)}
.dblock.flip .dblock-media{order:2}
.dblock-media .ph{border-radius:var(--r-xl);overflow:hidden;aspect-ratio:6/5;box-shadow:var(--sh-lg)}
.dblock-media .ph img{width:100%;height:100%;object-fit:cover}
.dblock-tag{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-d);font-weight:800;color:var(--gold-deep);font-size:.92rem}
.dblock-tag .n{background:var(--ink);color:var(--gold);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.85rem}
.dblock-body h2{margin-top:16px;font-size:clamp(1.7rem,2.8vw,2.4rem)}
.dblock-body>p{margin-top:14px;color:var(--muted)}
.dblock-feats{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dblock-feats li{display:flex;gap:10px;font-size:.92rem;color:var(--ink-2);align-items:flex-start}
.dblock-feats li svg{width:18px;height:18px;color:var(--gold-deep);flex-shrink:0;margin-top:2px}
.dblock-for{margin-top:22px;padding:16px 18px;background:var(--surface);border-radius:var(--r-sm);border-left:3px solid var(--gold);font-size:.92rem}
.dblock-for b{color:var(--ink);font-family:var(--f-d)}

/* ---------- PEAK HOURS ---------- */
.peak{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:8px}
.peak-day{text-align:center}
.peak-day .dn{font-family:var(--f-d);font-weight:800;font-size:.84rem;color:var(--ink);margin-bottom:5px}
.peak-day.full .dn{color:var(--gold-deep)}
.peak-day.free .dn{color:var(--ok)}
.peak-note{min-height:24px;margin-bottom:8px;display:flex;justify-content:center;align-items:center}
.peak-tag{font-size:.6rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:var(--r-pill);white-space:nowrap}
.peak-tag.full{background:#fdebd9;color:#b9670f}
.peak-tag.free{background:#dff3e6;color:#137a40}
.peak-tag.morn{background:var(--surface-2);color:var(--muted)}
.peak-bars{display:flex;flex-direction:column-reverse;gap:4px;height:140px;justify-content:flex-start}
.peak-bars i{border-radius:3px;background:var(--surface-2);transition:height .8s var(--e)}
.peak-bars i.lo{background:var(--gold-soft)}
.peak-bars i.mid{background:var(--gold)}
.peak-bars i.hi{background:var(--gold-deep)}
.peak-legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px;font-size:.85rem;color:var(--muted)}
.peak-legend span{display:flex;align-items:center;gap:8px}
.peak-legend i{width:14px;height:14px;border-radius:4px}

/* ---------- GALLERY ---------- */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:200px;gap:14px}
.gallery .g{border-radius:var(--r-md);overflow:hidden;position:relative}
.gallery .g img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--e)}
.gallery .g:hover img{transform:scale(1.06)}
.gallery .g.tall{grid-row:span 2}
.gallery .g.wide{grid-column:span 2}

/* ---------- ZONE SERVITE (SEO locale) ---------- */
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.6vw,20px)}
.zone{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:24px 26px;transition:transform .35s var(--e),box-shadow .35s var(--e),border-color .35s;
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.bg-surf .zone{background:var(--bg)}
.zone:hover{transform:translateY(-5px);box-shadow:var(--sh-md);border-color:var(--gold)}
.zone .zhd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.zone .zhd h3{font-size:1.18rem;color:var(--ink);margin:0}
.zone .zhd .km{
  font-family:var(--f-d);font-weight:800;font-size:.78rem;letter-spacing:.02em;
  color:var(--gold-deep);background:var(--gold-tint);padding:5px 11px;border-radius:var(--r-pill);
  white-space:nowrap;
}
.zone p{font-size:.92rem;color:var(--muted);line-height:1.55;margin:0}
.zone .ztime{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;color:var(--ink-2);margin-top:auto;padding-top:8px}
.zone .ztime svg{width:14px;height:14px;color:var(--gold-deep)}
@media(max-width:1080px){.zones{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.zones{grid-template-columns:1fr}}

/* ---------- REVIEWS ---------- */
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.8vw,22px)}
.rev-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column;gap:15px;transition:transform .35s var(--e),box-shadow .35s var(--e)}
.bg-surf .rev-card{background:var(--bg)}
.rev-card:hover{transform:translateY(-5px);box-shadow:var(--sh-md)}
.rev-card .top{display:flex;justify-content:space-between;align-items:center}
.rev-card .stars{color:var(--gold);letter-spacing:.08em;font-size:.95rem}
.rev-card .gg{width:22px;height:22px}
.rev-card p{font-size:.97rem;line-height:1.62;color:var(--ink-2);flex:1}
.rev-card .who{display:flex;align-items:center;gap:12px;padding-top:15px;border-top:1px solid var(--line)}
.rev-card .who .av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:1.05rem}
.rev-card .who b{display:block;font-family:var(--f-d);font-size:.93rem;color:var(--ink)}
.rev-card .who span{font-size:.78rem;color:var(--muted)}
.rev-feat{
  background:var(--ink);color:#fff;border-radius:var(--r-xl);
  padding:clamp(34px,4vw,58px);display:grid;grid-template-columns:auto 1fr;
  gap:clamp(22px,3vw,46px);align-items:center;
}
.rev-feat .score{text-align:center;padding-right:clamp(22px,3vw,46px);border-right:1px solid var(--dark-line)}
.rev-feat .score .n{font-family:var(--f-d);font-weight:800;font-size:clamp(3.4rem,5vw,4.6rem);color:#fff;line-height:.9;letter-spacing:-.04em}
.rev-feat .score .stars{color:var(--gold);font-size:1.1rem;margin-top:8px;letter-spacing:.1em}
.rev-feat .score .c{font-size:.82rem;color:var(--on-dark-mut);margin-top:8px}
.rev-feat blockquote{font-family:var(--f-d);font-weight:600;font-size:clamp(1.25rem,2vw,1.7rem);line-height:1.4;color:#fff;letter-spacing:-.02em}
.rev-feat blockquote span{color:var(--gold)}
.rev-feat cite{display:block;margin-top:16px;font-style:normal;font-size:.88rem;color:var(--on-dark-mut);font-family:var(--f-t);font-weight:600}

/* ---------- PRICING ---------- */
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,1.4vw,20px);align-items:stretch}
.plan{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(24px,2vw,32px);display:flex;flex-direction:column;position:relative;transition:transform .35s var(--e),box-shadow .35s var(--e)}
.plan:hover{transform:translateY(-6px);box-shadow:var(--sh-md)}
.plan.hot{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--sh-lg)}
.plan.hot:hover{box-shadow:0 40px 90px -36px rgba(14,15,18,.5)}
.plan .ptag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-family:var(--f-d);font-weight:800;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:5px 13px;border-radius:var(--r-pill);white-space:nowrap}
.plan .ptag.alt{background:var(--ink);color:var(--gold);border:1px solid var(--gold)}
.plan.hot .ptag.alt{background:var(--gold);color:var(--ink);border:0}
.plan h3{font-size:1.3rem}
.plan.hot h3{color:#fff}
.plan .pd{margin-top:7px;font-size:.84rem;color:var(--muted);min-height:2.4em}
.plan.hot .pd{color:var(--on-dark-mut)}
.plan .price{margin-top:20px;display:flex;align-items:flex-start;gap:3px;flex-wrap:wrap}
.plan .price .was{align-self:flex-end;font-family:var(--f-d);font-weight:700;font-size:1.05rem;color:var(--faint);text-decoration:line-through;margin-right:5px;margin-bottom:.4em}
.plan.hot .price .was{color:var(--on-dark-mut)}
.plan .price .c{font-family:var(--f-d);font-weight:700;font-size:1.3rem;color:var(--ink);margin-top:.45em}
.plan.hot .price .c{color:var(--gold)}
.plan .price .a{font-family:var(--f-d);font-weight:800;font-size:clamp(2.9rem,3.8vw,3.7rem);color:var(--ink);line-height:.85;letter-spacing:-.04em}
.plan.hot .price .a{color:#fff}
.plan .price .p{align-self:flex-end;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:.35em}
.plan.hot .price .p{color:var(--on-dark-mut)}
.plan .pline{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.plan.hot .pline{border-color:var(--dark-line)}
.plan li{display:flex;gap:11px;font-size:.93rem;color:var(--ink-2)}
.plan.hot li{color:var(--on-dark)}
.plan li svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;color:var(--gold-deep)}
.plan.hot li svg{color:var(--gold)}
.plan li.off{color:var(--faint)}
.plan li.off svg{color:var(--faint)}
.plan .btn{margin-top:26px}

/* ---------- COMPARE / INCLUDED ---------- */
.incl{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.8vw,22px)}
.incl .c{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;transition:transform .35s var(--e),box-shadow .35s var(--e)}
.incl .c:hover{transform:translateY(-5px);box-shadow:var(--sh-md)}
.incl .c .ic{width:46px;height:46px;border-radius:12px;background:var(--gold-tint);display:grid;place-items:center;margin-bottom:16px}
.incl .c .ic svg{width:23px;height:23px;color:var(--gold-deep)}
.incl .c .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.incl .c .px{font-family:var(--f-d);font-weight:800;font-size:1.5rem;color:var(--ink);letter-spacing:-.03em;white-space:nowrap}
.incl .c .px small{font-size:.6em;color:var(--muted);font-weight:600}
.incl .c h3{font-size:1.12rem}
.incl .c p{margin-top:8px;font-size:.91rem;color:var(--muted);line-height:1.55}

/* ---------- FAQ ---------- */
.faq{max-width:840px;margin-inline:auto;border-top:1px solid var(--line)}
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:22px;padding:22px 6px;text-align:left;font-family:var(--f-d);font-weight:700;font-size:clamp(1.02rem,1.5vw,1.22rem);color:var(--ink);transition:color .2s}
.faq-q:hover{color:var(--gold-deep)}
.faq-q .ic{position:relative;width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--surface);transition:background .25s}
.faq-item.open .faq-q .ic{background:var(--gold)}
.faq-q .ic::before,.faq-q .ic::after{content:"";position:absolute;left:50%;top:50%;background:var(--ink);transition:transform .3s var(--e)}
.faq-q .ic::before{width:11px;height:2px;transform:translate(-50%,-50%)}
.faq-q .ic::after{width:2px;height:11px;transform:translate(-50%,-50%)}
.faq-item.open .faq-q .ic::after{transform:translate(-50%,-50%) scaleY(0)}
.faq-a{overflow:hidden;max-height:0;transition:max-height .4s var(--e)}
.faq-a div{padding:0 6px 24px;color:var(--muted);line-height:1.65}

/* ---------- CTA BAND ---------- */
.cta{background:var(--ink);color:#fff;border-radius:var(--r-xl);padding:clamp(38px,5vw,72px);position:relative;overflow:hidden;text-align:center}
.cta::before{content:"";position:absolute;left:50%;top:-60%;width:70%;height:200%;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,180,0,.2),transparent 60%)}
.cta>*{position:relative;z-index:2}
.cta h2{color:#fff;font-size:clamp(1.9rem,3.6vw,3rem)}
.cta h2 em{font-style:normal;color:var(--gold)}
.cta p{margin:16px auto 0;max-width:48ch;color:var(--on-dark-mut)}
.cta-btns{margin-top:30px;display:flex;gap:13px;justify-content:center;flex-wrap:wrap}
.cta-mini{margin-top:22px;font-size:.85rem;color:var(--on-dark-mut);display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.cta-mini span{display:flex;align-items:center;gap:7px}
.cta-mini svg{width:15px;height:15px;color:var(--gold)}

/* ---------- TRAINER STRIP ---------- */
.tstrip{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(28px,4vw,64px);align-items:center}
.tstrip-media{position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:4/4.6}
.tstrip-media img{width:100%;height:100%;object-fit:cover}
.tstrip-media .nm{position:absolute;left:0;right:0;bottom:0;padding:24px;background:linear-gradient(transparent,rgba(14,15,18,.9))}
.tstrip-media .nm b{font-family:var(--f-d);font-weight:800;font-size:1.6rem;color:#fff;display:block}
.tstrip-media .nm span{color:var(--gold);font-size:.84rem;font-weight:600}
.tstrip-body .quote{font-family:var(--f-d);font-weight:600;font-size:clamp(1.3rem,2vw,1.85rem);line-height:1.38;color:var(--ink);letter-spacing:-.02em;margin-top:18px}
.tstrip-body .quote em{font-style:normal;color:var(--gold-deep)}
.tstrip-body>p{margin-top:18px;color:var(--muted)}
.tstrip-tags{margin-top:22px;display:flex;flex-wrap:wrap;gap:9px}
.tstrip-tags span{padding:8px 14px;background:var(--surface);border-radius:var(--r-pill);font-size:.83rem;font-weight:600;color:var(--ink-2)}

/* ---------- BOOKING ---------- */
.booking{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(24px,3vw,46px);align-items:start}
.bk-form{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(26px,3vw,44px);box-shadow:var(--sh-sm)}
.bk-form .step-lbl{font-family:var(--f-d);font-weight:700;font-size:1.05rem;color:var(--ink);display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bk-form .step-lbl .sn{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--gold);font-size:.78rem;font-weight:800;display:grid;place-items:center}
.bk-form .grp+.grp{margin-top:26px}
.field{display:flex;flex-direction:column;gap:7px}
.field+.field{margin-top:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frow .field+.field{margin-top:0}
.field label{font-size:.85rem;font-weight:700;color:var(--ink)}
.field label .req{color:var(--gold-deep)}
.field input,.field select,.field textarea{
  width:100%;min-width:0;padding:13px 15px;border:1.5px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--bg);font-size:.95rem;transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-tint)}
.field textarea{resize:vertical;min-height:88px}
.field input.err,.field select.err{border-color:#e0413a;box-shadow:0 0 0 4px rgba(224,65,58,.1)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  padding:11px 16px;border:1.5px solid var(--line-2);border-radius:var(--r-pill);
  font-size:.88rem;font-weight:600;color:var(--ink-2);background:var(--bg);
  transition:all .22s var(--e);
}
.chip:hover{border-color:var(--ink)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.sel::before{content:"✓ ";color:var(--gold);font-weight:800}
.bk-submit{margin-top:28px}
.bk-note{margin-top:14px;font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:center}
.bk-note svg{width:15px;height:15px;color:var(--ok)}
.bk-alt{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);text-align:center;font-size:.9rem;color:var(--muted)}
.bk-alt a{font-weight:700;color:var(--ink)}
.bk-alt a:hover{color:var(--gold-deep)}

.bk-success{display:none;text-align:center;padding:clamp(30px,4vw,56px)}
.bk-success.show{display:block;animation:pageIn .5s var(--e)}
.bk-success .ck{width:74px;height:74px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:0 auto 22px}
.bk-success .ck svg{width:36px;height:36px;color:#fff}
.bk-success h3{font-size:1.6rem}
.bk-success p{margin-top:12px;color:var(--muted);max-width:42ch;margin-inline:auto}
.bk-success .btn{margin-top:24px}

.bk-side{display:flex;flex-direction:column;gap:16px}
.bk-side .panel{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:28px}
.bk-side .panel h3{color:#fff;font-size:1.15rem;margin-bottom:16px}
.bk-side .panel .step{display:flex;gap:13px;padding:11px 0}
.bk-side .panel .step+.step{border-top:1px solid var(--dark-line)}
.bk-side .panel .step .d{width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--f-d);font-weight:800;font-size:.82rem;display:grid;place-items:center;flex-shrink:0}
.bk-side .panel .step b{font-family:var(--f-d);color:#fff;font-size:.95rem;display:block}
